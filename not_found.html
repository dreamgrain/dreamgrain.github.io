<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="misc/favicon.svg">
  <title>DreamGrain - 404</title>
  <meta name="author" content="Exin">
  <meta name="description" content="Page not found">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
      background: linear-gradient(#cfd1de, #a3a0c0);
      color: #222233;
      font-size: 14px;
    }

    #wrapper {
      width: 820px;
      margin: 20px auto 40px auto;
      background: #fefefe;
      border: 1px solid #8f90a0;
      box-shadow: 0 0 12px rgba(20,20,50,0.2);
    }

    header {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: transparent;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: -0.4px;
      color: #2a2a3f;
      text-shadow: 0 1px 0 #e0e0f5;
    }

    .broken-title {
      display: inline-block;
      white-space: nowrap;
      letter-spacing: -1px;
      transform: rotate(-1deg);
    }

    .broken-title span {
      display: inline-block;
      position: relative;
    }

    .broken-title .dream {
      color: #6488CF;
    }

    .broken-title .grain {
      color: #9563C5;
    }

    .broken-title .l1 {
      transform: translate(-2px, 3px) rotate(-12deg);
    }

    .broken-title .l2 {
      transform: translate(1px, -3px) rotate(8deg);
    }

    .broken-title .l3 {
      transform: translate(-2px, 4px) rotate(14deg);
    }

    .broken-title .l4 {
      transform: translate(2px, -2px) rotate(-9deg);
    }

    .broken-title .l5 {
      transform: translate(-1px, 3px) rotate(11deg);
    }

    .broken-title .l6 {
      transform: translate(1px, -4px) rotate(-15deg);
    }

    .broken-title .l7 {
      transform: translate(-2px, 2px) rotate(10deg);
    }

    .broken-title .l8 {
      transform: translate(2px, -3px) rotate(-8deg);
    }

    .broken-title .l9 {
      transform: translate(-1px, 4px) rotate(13deg);
    }

    .broken-title .l10 {
      transform: translate(2px, -2px) rotate(-14deg);
    }

    #content {
      padding: 40px 20px;
      text-align: center;
      line-height: 1.6;
    }

    /* Updated image styling */
    #content img {
      display: block;
      margin: 20px auto;
      max-width: 250px; /* smaller size */
      width: 100%;
      height: auto;
      border: none; /* removed border */
      box-shadow: none; /* removed shadow */
    }

    h2 {
      margin-top: 0;
      font-size: 22px;
      color: #2a2a3f;
      text-shadow: 0 1px 0 #e0e0f5;
    }

    p {
      margin: 14px 0;
      color: #33334a;
    }

    .hint {
      font-size: 13px;
      color: #55556f;
      margin-top: 22px;
    }

    a {
      color: #2e3380;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      color: #1f2460;
    }

    @media (max-width: 860px) {
      #wrapper {
        width: 96%;
        margin: 16px auto;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1 class="broken-title"><span class="dream"><span class="l1">D</span><span class="l2">r</span><span class="l3">e</span><span class="l4">a</span><span class="l5">m</span></span><span class="grain"><span class="l6">G</span><span class="l7">r</span><span class="l8">a</span><span class="l9">i</span><span class="l10">n</span></span></h1>
  </header>

  <div id="wrapper">
    <div id="content">
      <h2>404</h2>

      <p>
      </p>

      <img src="/misc/404.jpg" alt="404 Image">

      <p>
      </p>

      <p class="hint">
        Return <a href="index.html">home</a> and try again.
      </p>
    </div>
  </div>

</body>
</html>
