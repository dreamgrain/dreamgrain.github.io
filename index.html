<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="misc/favicon.svg">
<meta charset="utf-8">
<title>DreamGrain</title>
<meta name="author" content="Exin">
<meta name="description" content="home">

<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
    background: linear-gradient(#cfd1de, #a3a0c0);
    color: #222233;
    font-size: 14px;
  }

  #wrapper {
    width: 820px;
    margin: 40px auto;
    background: #fefefe;
    border: 1px solid #8f90a0;
    box-shadow: 0 0 12px rgba(20,20,50,0.2);
  }

  header {
    padding: 18px 20px;
    background: linear-gradient(#d1d2e4, #a9aacf);
    border-bottom: 1px solid #8889a2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: 27px;
    letter-spacing: -0.4px;
    color: #2a2a3f;
    text-shadow: 0 1px 0 #e0e0f5;
    animation: splashPulse 0.9s ease-in-out infinite;
    transform-origin: center;
  }

  .subtitle {
    margin-top: 8px;
    font-size: 13px;
    color: #4a4a65;
  }

  #content {
    padding: 30px 20px 40px 20px;
    text-align: center;
  }

  .hub-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px 40px;
    margin-top: 30px;
  }

  .hub-item {
    width: 120px;
    text-align: center;
    text-decoration: none;
    color: #2a2a3f;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hub-item img {
    width: 64px;
    height: 64px;
    object-fit: contain;
    margin-bottom: 8px;
    transition: transform 0.2s ease, filter 0.2s ease;
  }

  .hub-item:hover img {
    transform: scale(1.1);
    filter: drop-shadow(0 2px 6px rgba(0,0,40,0.3));
  }

  .hub-label {
    font-size: 13px;
    color: #3b3b55;
  }

  footer {
    padding: 12px 20px;
    font-size: 12px;
    color: #5a5a70;
    border-top: 1px solid #9b9bb3;
    background: linear-gradient(#d4d5e5, #b8b9cc);
    text-align: right;
  }

  @media (max-width: 860px) {
    #wrapper {
      width: 96%;
      margin: 16px auto;
    }

    .hub-item {
      width: 42%;
    }
  }

  @keyframes splashPulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
</style>
</head>

<body>

<div id="wrapper">

  <header>
    <h1><span style="color: #6488CF;">Dream</span><span style="color: #9563C5;">Grain</span></h1>
    <div class="subtitle" id="subtitle"></div>
  </header>

  <div id="content">

    <div class="hub-container">

      <a class="hub-item" href="photos/photos.html">
        <img src="misc/homeicons/notbroken.svg" alt="Photos">
        <div class="hub-label">Photos</div>
      </a>

      <a class="hub-item" href="about/about.html">
        <img src="misc/homeicons/abouticon.svg" alt="About">
        <div class="hub-label">About</div>
      </a>

      <a class="hub-item" href="blog/blog.html">
        <img src="misc/homeicons/blogicon.svg" alt="Blog">
        <div class="hub-label">Blog</div>
      </a>

      <a class="hub-item" href="guestbook/guestbook.html">
        <img src="misc/homeicons/guestbookicon.svg" alt="Guest Book">
        <div class="hub-label">Guest Book</div>
      </a>

      <a class="hub-item" href="contact/contact.html">
        <img src="misc/homeicons/contacticon.svg" alt="Contact">
        <div class="hub-label">Contact</div>
      </a>

    </div>

  </div>

  <footer>
  </footer>

</div>

<script>
  const subtitles = [
    "Every saint has a past, every sinner has a future.",
    "Love God, serve others, make disciples.",
    "Leave it all to me.",
    "You WILL die one day. Remember that and act accordingly.",
    "With great power comes great responsibility.",
    "sudo pacman -Syu",
    "MASSIVE LEGEND HERE",
    "Ey b0ss.",
    "I thought you were smarter than that.",
    "So long gay Bowser.",
    "What happens in maintenance stays in maintenance.",
    "FOSS!",
    "Are you the greatest?",
    "A broken clock is right twice a day.",
    "Giggity",
    "Only say the word and my soul shall be healed.",
    "Deus vult.",
    "I still believe in your eyes.",
    "How's ya motha?",
    "Better than I deserve.",
  ];

  const subtitleElement = document.getElementById("subtitle");
  const randomIndex = Math.floor(Math.random() * subtitles.length);
  subtitleElement.textContent = subtitles[randomIndex];
</script>
</body>
</html>
